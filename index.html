<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWAY Paperclip</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📎</text></svg>">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <style>
    :root {
      --bg-primary:#ffffff;--bg-secondary:#f8f9fa;--bg-tertiary:#f1f3f5;
      --text-primary:#1a1a2e;--text-secondary:#6b7280;--text-tertiary:#9ca3af;
      --border:#e5e7eb;--accent:#6366f1;--accent-light:#eef2ff;
      --success:#10b981;--success-light:#ecfdf5;--warning:#f59e0b;--warning-light:#fffbeb;
      --danger:#ef4444;--danger-light:#fef2f2;--info:#3b82f6;--info-light:#eff6ff;
      --sidebar-width:240px;--header-height:56px;--radius:8px;--radius-lg:12px;--transition:150ms ease;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg-primary:#0f0f1a;--bg-secondary:#1a1a2e;--bg-tertiary:#16213e;
      --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-tertiary:#64748b;
      --border:#2d3748;--accent-light:#1e1b4b;--success-light:#064e3b;
      --warning-light:#451a03;--danger-light:#450a0a;--info-light:#1e3a5f;
    }}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-tertiary);color:var(--text-primary);line-height:1.5}
    .app{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:var(--sidebar-width);background:var(--bg-primary);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .header{height:var(--header-height);background:var(--bg-primary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
    .content{flex:1;overflow-y:auto;padding:24px}
    .sidebar-brand{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px}
    .sidebar-section{padding:12px 8px 4px}
    .sidebar-section-title{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-tertiary);padding:0 8px 4px;letter-spacing:.05em}
    .sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text-secondary);transition:all var(--transition)}
    .sidebar-item:hover{background:var(--bg-secondary);color:var(--text-primary)}
    .sidebar-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
    .sidebar-icon{font-size:16px;width:20px;text-align:center}
    .sidebar-badge{margin-left:auto;background:var(--danger);color:white;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:600}
    .card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .metric-card{display:flex;flex-direction:column;gap:4px}
    .metric-label{font-size:13px;color:var(--text-secondary)}
    .metric-value{font-size:28px;font-weight:700}
    .metric-sub{font-size:12px;color:var(--text-tertiary)}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500}
    .badge-idle{background:var(--bg-secondary);color:var(--text-secondary)}
    .badge-working{background:var(--info-light);color:var(--info)}
    .badge-paused{background:var(--warning-light);color:var(--warning)}
    .badge-error{background:var(--danger-light);color:var(--danger)}
    .badge-done{background:var(--success-light);color:var(--success)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);font-size:14px;cursor:pointer;transition:all var(--transition)}
    .btn:hover{background:var(--bg-secondary)}
    .btn-primary{background:var(--accent);color:white;border-color:var(--accent)}
    .btn-primary:hover{opacity:.9}
    .table-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background var(--transition)}
    .table-row:hover{background:var(--bg-secondary)}
    .table-row:last-child{border-bottom:none}
    .input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--bg-primary);color:var(--text-primary);outline:none}
    .input:focus{border-color:var(--accent)}
    .setup-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg-tertiary)}
    .setup-card{background:var(--bg-primary);border-radius:var(--radius-lg);padding:40px;max-width:480px;width:100%;border:1px solid var(--border);text-align:center}
    .text-sm{font-size:13px}.text-muted{color:var(--text-secondary)}.font-medium{font-weight:500}.font-bold{font-weight:700}
    #loading{display:flex;align-items:center;justify-content:center;height:100vh;color:#6b7280;font-family:sans-serif;font-size:16px}
    @media(max-width:768px){.sidebar{display:none}.content{padding:16px}.card-grid{grid-template-columns:1fr 1fr}}
    /* Kanban */
    .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;min-height:0;flex:1}
    .kanban-col{min-width:240px;width:240px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 160px)}
    .kanban-col-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:13px;font-weight:600;border-radius:var(--radius) var(--radius) 0 0;background:var(--bg-secondary);border:1px solid var(--border);border-bottom:none}
    .kanban-col-count{background:var(--bg-tertiary);color:var(--text-tertiary);font-size:11px;padding:1px 6px;border-radius:8px;font-weight:500}
    .kanban-col-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--bg-secondary);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
    .kanban-card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:all var(--transition);position:relative}
    .kanban-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(99,102,241,0.1)}
    .kanban-card-id{font-size:11px;color:var(--text-tertiary);font-weight:500}
    .kanban-card-title{font-size:13px;font-weight:500;margin:4px 0}
    .kanban-card-footer{display:flex;align-items:center;gap:6px;margin-top:6px}
    .kanban-card-agent{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:3px}
    .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .priority-low{background:#94a3b8}.priority-medium{background:#f59e0b}.priority-high{background:#ef4444}.priority-urgent{background:#dc2626;box-shadow:0 0 4px rgba(220,38,38,0.4)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
    .modal{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:90%;max-width:520px;max-height:80vh;overflow-y:auto}
    .modal h2{font-size:18px;margin-bottom:16px}
    .move-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
    .move-btn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg-secondary);cursor:pointer;color:var(--text-secondary);transition:all var(--transition)}
    .move-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
    .move-btn.current{background:var(--accent);color:white;border-color:var(--accent)}
    /* Heartbeat */
    .hb-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500}
    .hb-active{background:var(--success-light);color:var(--success)}
    .hb-stopped{background:var(--bg-secondary);color:var(--text-tertiary)}
    .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse-anim 1.5s infinite}
    @keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
    .run-log{max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:12px;white-space:pre-wrap;line-height:1.6}
    .run-card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
    .run-card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .cost-pill{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--warning-light);color:var(--warning);font-weight:500}
    .token-pill{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--info-light);color:var(--info);font-weight:500}
    /* Cost Dashboard */
    .progress-bar{width:100%;height:8px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden}
    .progress-fill{height:100%;border-radius:4px;transition:width .3s ease}
    .daily-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0}
    .daily-bar{flex:1;min-width:0;border-radius:3px 3px 0 0;background:var(--accent);transition:height .3s ease;position:relative;cursor:default}
    .daily-bar:hover{opacity:.8}
    .daily-label{font-size:10px;color:var(--text-tertiary);text-align:center;margin-top:4px}
    .model-bar{display:flex;height:24px;border-radius:4px;overflow:hidden;gap:1px}
    .model-segment{height:100%;transition:width .3s ease;min-width:2px}
  </style>
</head>
<body>
<div id="root"><div id="loading">📎 로딩 중...</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const STORAGE_KEY = "jway-paperclip";
const LOCK_KEY = "jway-paperclip-lock";
const AUTH_KEY = "jway-paperclip-auth";
const VER = "0.3.0";

async function hashPassword(pw) {
  var enc = new TextEncoder().encode(pw);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
}
const MODELS = {
  "claude-opus-4-6":           { name: "Opus 4.6",   inputPer1M: 500, outputPer1M: 2500 },
  "claude-sonnet-4-5":         { name: "Sonnet 4.5", inputPer1M: 300, outputPer1M: 1500 },
  "claude-sonnet-4-6":         { name: "Sonnet 4.5", inputPer1M: 300, outputPer1M: 1500 },
  "claude-haiku-4-5-20251001": { name: "Haiku 4.5",  inputPer1M: 100, outputPer1M: 500  },
};

function load() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function save(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function init() { return { version: VER, settings: { apiKey: "", companyName: "JWAY Digital" }, companies: [], agents: [], issues: [], projects: [], goals: [], costEvents: [], budgetPolicies: [], heartbeatRuns: [], routines: [], approvals: [], activityLog: [], plugins: [] }; }
function uid() { return crypto.randomUUID(); }
function now() { return new Date().toISOString(); }

// ========== Claude API Service ==========
async function callClaudeAPI(apiKey, model, systemPrompt, userMessage, maxTokens) {
  maxTokens = maxTokens || 2048;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: "user", content: userMessage }],
    }),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error("API Error " + res.status + ": " + err);
  }
  return await res.json();
}

function calcCostCents(model, usage) {
  const p = MODELS[model];
  if (!p || !usage) return 0;
  const inp = ((usage.input_tokens || 0) / 1000000) * p.inputPer1M;
  const cached = ((usage.cache_read_input_tokens || 0) / 1000000) * p.inputPer1M * 0.1;
  const out = ((usage.output_tokens || 0) / 1000000) * p.outputPer1M;
  return Math.round((inp + cached + out) * 100) / 100;
}

// ========== Heartbeat Engine ==========
function buildAgentPrompt(agent, issues, data) {
  const assignedIssues = issues.filter(function(i) {
    return i.assigneeAgentId === agent.id && i.status !== "done" && i.status !== "cancelled";
  });
  const company = data.companies[0];
  var prompt = "당신은 " + (company ? company.name : "JWAY Digital") + "의 " + agent.name + " (" + (agent.title || agent.role) + ") 입니다.\n\n";
  prompt += "## 역할 및 역량\n" + (agent.capabilities || "일반 업무") + "\n\n";

  if (assignedIssues.length > 0) {
    prompt += "## 할당된 이슈 목록\n";
    assignedIssues.forEach(function(issue) {
      prompt += "- [" + issue.identifier + "] " + issue.title + " (상태: " + issue.status + ", 우선순위: " + issue.priority + ")\n";
      if (issue.description) prompt += "  설명: " + issue.description + "\n";
    });
  } else {
    prompt += "## 현재 할당된 이슈가 없습니다.\n";
  }

  prompt += "\n## 지시사항\n";
  prompt += "할당된 이슈를 검토하고, 각 이슈에 대해 다음 JSON 형식으로 응답해주세요:\n";
  prompt += '```json\n{\n  "actions": [\n    {\n      "issueId": "이슈ID",\n      "action": "start|complete|comment",\n      "comment": "작업 내용이나 결과 설명"\n    }\n  ],\n  "summary": "전체 업무 요약"\n}\n```\n';
  prompt += "- action이 'start'면 이슈를 '진행 중'으로 변경\n";
  prompt += "- action이 'complete'면 이슈를 '완료'로 변경\n";
  prompt += "- action이 'comment'면 코멘트만 추가\n";
  prompt += "- 할당된 이슈가 없으면 summary만 작성\n";

  return prompt;
}

function parseAgentResponse(text) {
  try {
    var jsonMatch = text.match(/```json\s*([\s\S]*?)```/);
    if (jsonMatch) return JSON.parse(jsonMatch[1]);
    var braceMatch = text.match(/\{[\s\S]*"actions"[\s\S]*\}/);
    if (braceMatch) return JSON.parse(braceMatch[0]);
    return { actions: [], summary: text.substring(0, 200) };
  } catch (e) {
    return { actions: [], summary: text.substring(0, 200) };
  }
}

async function executeHeartbeat(agent, data, onUpdate) {
  var company = data.companies[0];
  if (!company || !data.settings.apiKey) return null;

  // Budget check
  if (agent.budgetMonthlyCents > 0 && agent.spentMonthlyCents >= agent.budgetMonthlyCents) {
    return { error: "budget_exceeded", agent: agent.name };
  }

  var model = (agent.adapterConfig && agent.adapterConfig.model) || "claude-sonnet-4-5";
  var systemPrompt = (agent.adapterConfig && agent.adapterConfig.systemPrompt) || "";
  if (!systemPrompt) {
    systemPrompt = "당신은 AI 에이전트 회사의 " + (agent.title || agent.role) + "입니다. 주어진 업무를 성실히 수행하세요. 한국어로 응답하세요.";
  }

  var userMessage = buildAgentPrompt(agent, data.issues, data);
  var runId = uid();
  var startTime = now();

  try {
    // Update agent status to working
    var updatedAgents = data.agents.map(function(a) {
      return a.id === agent.id ? { ...a, status: "working", lastHeartbeatAt: startTime, updatedAt: startTime } : a;
    });
    var tempData = { ...data, agents: updatedAgents };
    onUpdate(tempData);

    var response = await callClaudeAPI(data.settings.apiKey, model, systemPrompt, userMessage, (agent.adapterConfig && agent.adapterConfig.maxTokens) || 2048);

    var responseText = response.content.map(function(c) { return c.text || ""; }).join("\n");
    var usage = response.usage || {};
    var costCents = calcCostCents(model, usage);
    var parsed = parseAgentResponse(responseText);

    // Apply actions to issues
    var updatedIssues = [...tempData.issues];
    var logs = [];
    if (parsed.actions && parsed.actions.length > 0) {
      parsed.actions.forEach(function(act) {
        updatedIssues = updatedIssues.map(function(issue) {
          if (issue.id === act.issueId || issue.identifier === act.issueId) {
            var changes = { updatedAt: now() };
            if (act.action === "start") { changes.status = "in_progress"; changes.startedAt = now(); }
            else if (act.action === "complete") { changes.status = "done"; changes.completedAt = now(); }
            logs.push({ id: uid(), emoji: act.action === "complete" ? "✅" : "🔄", message: agent.icon + " " + agent.name + ": " + (issue.identifier || "") + " → " + (act.action === "complete" ? "완료" : act.action === "start" ? "진행 중" : "코멘트") + (act.comment ? " — " + act.comment.substring(0, 80) : ""), createdAt: now() });
            return { ...issue, ...changes };
          }
          return issue;
        });
      });
    }

    // Record cost event
    var costEvent = {
      id: uid(), companyId: company.id, agentId: agent.id, provider: "anthropic",
      model: model, inputTokens: usage.input_tokens || 0,
      cachedInputTokens: usage.cache_read_input_tokens || 0,
      outputTokens: usage.output_tokens || 0, costCents: costCents, occurredAt: now(), createdAt: now(),
    };

    // Record heartbeat run
    var hbRun = {
      id: runId, companyId: company.id, agentId: agent.id, model: model,
      status: "completed", inputTokens: usage.input_tokens || 0,
      outputTokens: usage.output_tokens || 0, costCents: costCents,
      summary: parsed.summary || "", responseExcerpt: responseText.substring(0, 500),
      startedAt: startTime, completedAt: now(),
    };

    // Update agent spent + status back to idle
    var finalAgents = tempData.agents.map(function(a) {
      if (a.id === agent.id) {
        return { ...a, status: "idle", spentMonthlyCents: a.spentMonthlyCents + costCents, lastHeartbeatAt: now(), updatedAt: now() };
      }
      return a;
    });

    logs.push({ id: uid(), emoji: "💓", message: agent.icon + " " + agent.name + " heartbeat 완료 — " + (usage.input_tokens || 0) + "+" + (usage.output_tokens || 0) + " tokens, $" + (costCents / 100).toFixed(2), createdAt: now() });

    var finalData = {
      ...tempData,
      agents: finalAgents,
      issues: updatedIssues,
      costEvents: [...tempData.costEvents, costEvent],
      heartbeatRuns: [...tempData.heartbeatRuns, hbRun],
      activityLog: [...tempData.activityLog, ...logs],
    };
    onUpdate(finalData);
    return { success: true, run: hbRun, costCents: costCents };

  } catch (err) {
    // Set agent to error
    var errAgents = data.agents.map(function(a) {
      return a.id === agent.id ? { ...a, status: "error", updatedAt: now() } : a;
    });
    var errLog = { id: uid(), emoji: "❌", message: agent.icon + " " + agent.name + " heartbeat 실패: " + err.message.substring(0, 100), createdAt: now() };
    var errRun = { id: runId, companyId: company.id, agentId: agent.id, model: model, status: "error", error: err.message, startedAt: startTime, completedAt: now(), costCents: 0 };
    onUpdate({ ...data, agents: errAgents, heartbeatRuns: [...data.heartbeatRuns, errRun], activityLog: [...data.activityLog, errLog] });
    return { success: false, error: err.message };
  }
}

function LockScreen({ onUnlock }) {
  var hasLock = !!localStorage.getItem(LOCK_KEY);
  const [mode, setMode] = useState(hasLock ? "login" : "setup");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");

  const handleSetup = async () => {
    if (pw.length < 4) { setError("비밀번호는 4자 이상이어야 합니다."); return; }
    if (pw !== pw2) { setError("비밀번호가 일치하지 않습니다."); return; }
    var hash = await hashPassword(pw);
    localStorage.setItem(LOCK_KEY, hash);
    sessionStorage.setItem(AUTH_KEY, "1");
    onUnlock();
  };

  const handleLogin = async () => {
    if (!pw) { setError("비밀번호를 입력해주세요."); return; }
    var hash = await hashPassword(pw);
    var stored = localStorage.getItem(LOCK_KEY);
    if (hash === stored) {
      sessionStorage.setItem(AUTH_KEY, "1");
      setError("");
      onUnlock();
    } else {
      setError("비밀번호가 틀렸습니다.");
    }
  };

  const handleKey = (e) => { if (e.key === "Enter") { mode === "setup" ? handleSetup() : handleLogin(); } };

  return (
    <div className="setup-screen">
      <div className="setup-card">
        <div style={{fontSize:48,marginBottom:16}}>🔒</div>
        <h1 style={{fontSize:24,marginBottom:8}}>JWAY Paperclip</h1>
        {mode === "setup" ? (
          <div>
            <p style={{color:"var(--text-secondary)",marginBottom:24}}>처음 사용하시네요! 비밀번호를 설정해주세요.</p>
            <div style={{textAlign:"left",display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <label className="text-sm font-medium" style={{display:"block",marginBottom:4}}>비밀번호</label>

function IssuesPage({ data, onUpdate }) {
  const COLS = [
    {id:"backlog",label:"Backlog",color:"var(--text-tertiary)"},
    {id:"todo",label:"To Do",color:"var(--info)"},
    {id:"in_progress",label:"진행 중",color:"var(--warning)"},
    {id:"review",label:"리뷰",color:"var(--accent)"},
    {id:"done",label:"완료",color:"var(--success)"},
  ];
  const PRIS = ["low","medium","high","urgent"];
  const [showForm,setShowForm] = useState(false);
  const [selected,setSelected] = useState(null);
  const [dragId,setDragId] = useState(null);
  const blank = {title:"",description:"",priority:"medium",assigneeAgentId:"",projectId:""};
  const [f,setF] = useState({...blank});

  const nextNumber = () => {
    const co = data.companies[0];
    if(!co) return {num:1,id:"JWAY-1"};
    const n = (co.issueCounter||0)+1;
    return {num:n,id:co.issuePrefix+"-"+n};
  };

  const create = () => {
    if(!f.title.trim()) return;
    const co = data.companies[0];
    const {num,id:identifier} = nextNumber();
    const issue = {id:uid(),companyId:co?co.id:"",projectId:f.projectId||null,goalId:null,parentId:null,title:f.title,description:f.description,status:"backlog",priority:f.priority,assigneeAgentId:f.assigneeAgentId||null,issueNumber:num,identifier:identifier,originKind:"manual",createdAt:now(),updatedAt:now(),startedAt:null,completedAt:null};
    const updatedCo = co ? {...co, issueCounter:num} : co;
    onUpdate({...data,
      issues:[...data.issues,issue],
      companies: data.companies.map(c=>c.id===co.id?updatedCo:c),
      activityLog:[...data.activityLog,{id:uid(),emoji:"📋",message:identifier+" \""+f.title+"\" 이슈 생성됨",createdAt:now()}],
    });
    setF({...blank}); setShowForm(false);
  };

  const moveIssue = (issueId, newStatus) => {
    const extra = {};
    if(newStatus==="in_progress") extra.startedAt = now();
    if(newStatus==="done") extra.completedAt = now();
    onUpdate({...data,
      issues:data.issues.map(i=>i.id===issueId?{...i,status:newStatus,updatedAt:now(),...extra}:i),
      activityLog:[...data.activityLog,{id:uid(),emoji:newStatus==="done"?"✅":"🔄",message:(data.issues.find(i=>i.id===issueId)||{}).identifier+" → "+newStatus,createdAt:now()}],
    });
    if(selected && selected.id===issueId) setSelected({...selected,status:newStatus,...extra});
  };

  const deleteIssue = (issueId) => {
    const issue = data.issues.find(i=>i.id===issueId);
    onUpdate({...data,
      issues:data.issues.filter(i=>i.id!==issueId),
      activityLog:[...data.activityLog,{id:uid(),emoji:"🗑️",message:(issue?issue.identifier:"이슈")+" 삭제됨",createdAt:now()}],
    });
    setSelected(null);
  };

  const updateIssue = (issueId, changes) => {
    onUpdate({...data,issues:data.issues.map(i=>i.id===issueId?{...i,...changes,updatedAt:now()}:i)});
    if(selected && selected.id===issueId) setSelected({...selected,...changes});
  };

  const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed="move"; };
  const onDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect="move"; };
  const onDrop = (e, colId) => { e.preventDefault(); if(dragId) moveIssue(dragId, colId); setDragId(null); };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16,height:"100%"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>이슈 보드 ({data.issues.length})</div>
        <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>{showForm?"취소":"+ 이슈 생성"}</button>
      </div>

      {showForm&&(
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="이슈 제목 *" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={e=>setF({...f,description:e.target.value})} rows={2} style={{resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}>
            <select className="input" value={f.priority} onChange={e=>setF({...f,priority:e.target.value})} style={{flex:1}}>
              <option value="low">🟢 Low</option><option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option><option value="urgent">🚨 Urgent</option>
            </select>
            <select className="input" value={f.assigneeAgentId} onChange={e=>setF({...f,assigneeAgentId:e.target.value})} style={{flex:1}}>
              <option value="">담당자 없음</option>
              {data.agents.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name}</option>)}
            </select>
            <select className="input" value={f.projectId} onChange={e=>setF({...f,projectId:e.target.value})} style={{flex:1}}>
              <option value="">프로젝트 없음</option>
              {data.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <button className="btn btn-primary" onClick={create}>이슈 생성</button>
        </div>
      )}

      <div className="kanban">
        {COLS.map(col=>{
          const colIssues = data.issues.filter(i=>i.status===col.id).sort((a,b)=>{
            const po={urgent:0,high:1,medium:2,low:3};
            return (po[a.priority]||2)-(po[b.priority]||2);
          });
          return (
            <div key={col.id} className="kanban-col">
              <div className="kanban-col-header">
                <span><span style={{color:col.color}}>●</span> {col.label}</span>
                <span className="kanban-col-count">{colIssues.length}</span>
              </div>
              <div className="kanban-col-body" onDragOver={onDragOver} onDrop={e=>onDrop(e,col.id)}>
                {colIssues.map(issue=>{
                  const agent = data.agents.find(a=>a.id===issue.assigneeAgentId);
                  return (
                    <div key={issue.id} className="kanban-card" draggable onDragStart={e=>onDragStart(e,issue.id)} onClick={()=>setSelected(issue)}>
                      <div className="kanban-card-id">{issue.identifier}</div>
                      <div className="kanban-card-title">{issue.title}</div>
                      <div className="kanban-card-footer">
                        <span className={"priority-dot priority-"+issue.priority} title={issue.priority}/>
                        {agent && <span className="kanban-card-agent">{agent.icon} {agent.name}</span>}
                        {!agent && <span className="kanban-card-agent" style={{color:"var(--text-tertiary)"}}>미배정</span>}
                      </div>
                    </div>
                  );
                })}
                {colIssues.length===0 && <div className="text-sm text-muted" style={{padding:16,textAlign:"center",opacity:0.5}}>드래그하여 이동</div>}
              </div>
            </div>
          );
        })}

      {selected && (
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setSelected(null)}}>
          <div className="modal">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"start",marginBottom:16}}>
              <div>
                <div className="text-sm text-muted">{selected.identifier}</div>
                <h2 style={{margin:0}}>{selected.title}</h2>
              </div>
              <button className="btn" style={{padding:"4px 8px",fontSize:12}} onClick={()=>setSelected(null)}>✕</button>
            </div>

            {selected.description && <div className="text-sm" style={{marginBottom:16,padding:12,background:"var(--bg-secondary)",borderRadius:"var(--radius)",whiteSpace:"pre-wrap"}}>{selected.description}</div>}

            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <div className="text-sm font-medium" style={{marginBottom:4}}>상태</div>
                <div className="move-btns">
                  {COLS.map(c=><button key={c.id} className={"move-btn"+(selected.status===c.id?" current":"")} onClick={()=>moveIssue(selected.id,c.id)}>{c.label}</button>)}
                </div>
              </div>
              <div>
                <div className="text-sm font-medium" style={{marginBottom:4}}>우선순위</div>
                <div className="move-btns">
                  {PRIS.map(p=><button key={p} className={"move-btn"+(selected.priority===p?" current":"")} onClick={()=>updateIssue(selected.id,{priority:p})}>{p==="low"?"🟢 Low":p==="medium"?"🟡 Medium":p==="high"?"🔴 High":"🚨 Urgent"}</button>)}
                </div>
              </div>
              <div>
                <div className="text-sm font-medium" style={{marginBottom:4}}>담당자</div>
                <select className="input" value={selected.assigneeAgentId||""} onChange={e=>updateIssue(selected.id,{assigneeAgentId:e.target.value||null})}>
                  <option value="">미배정</option>
                  {data.agents.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <div className="text-sm text-muted" style={{flex:1}}>생성: {new Date(selected.createdAt).toLocaleString("ko-KR")}</div>
                <button className="btn" style={{padding:"4px 12px",fontSize:12,color:"var(--danger)"}} onClick={()=>deleteIssue(selected.id)}>삭제</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function HeartbeatPage({ data, onUpdate }) {
  const [running, setRunning] = useState(null);
  const [lastResult, setLastResult] = useState(null);
  const [autoMode, setAutoMode] = useState(false);
  const autoRef = React.useRef(null);

  const activeAgents = data.agents.filter(function(a) { return a.status !== "paused"; });
  const recentRuns = (data.heartbeatRuns || []).slice(-20).reverse();

  const runAgent = async (agent) => {
    setRunning(agent.id);
    setLastResult(null);
    var freshData = load() || data;
    var freshAgent = freshData.agents.find(function(a) { return a.id === agent.id; }) || agent;
    var result = await executeHeartbeat(freshAgent, freshData, function(d) { save(d); onUpdate(d); });
    setLastResult(result);
    setRunning(null);
  };

  const runAll = async () => {
    for (var i = 0; i < activeAgents.length; i++) {
      setRunning(activeAgents[i].id);
      var freshData = load() || data;
      var freshAgent = freshData.agents.find(function(a) { return a.id === activeAgents[i].id; }) || activeAgents[i];
      var result = await executeHeartbeat(freshAgent, freshData, function(d) { save(d); onUpdate(d); });
      setLastResult(result);
    }
    setRunning(null);
  };

  const toggleAuto = () => {
    if (autoMode) {
      if (autoRef.current) clearInterval(autoRef.current);
      autoRef.current = null;
      setAutoMode(false);
    } else {
      setAutoMode(true);
      autoRef.current = setInterval(async function() {
        var freshData = load();
        if (!freshData) return;
        var agents = freshData.agents.filter(function(a) { return a.status !== "paused" && a.status !== "working"; });
        for (var i = 0; i < agents.length; i++) {
          await executeHeartbeat(agents[i], freshData, function(d) { save(d); onUpdate(d); });
          freshData = load();
        }
      }, 5 * 60 * 1000);
    }
  };

  useEffect(function() { return function() { if (autoRef.current) clearInterval(autoRef.current); }; }, []);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="font-bold" style={{fontSize:18}}>💓 Heartbeat 엔진</div>
          <span className={"hb-status " + (autoMode ? "hb-active" : "hb-stopped")}>
            {autoMode && <span className="pulse"/>}
            {autoMode ? "자동 실행 중 (5분 간격)" : "수동 모드"}
          </span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={toggleAuto}>
            {autoMode ? "⏸ 자동 중지" : "▶️ 자동 시작"}
          </button>
          <button className="btn btn-primary" onClick={runAll} disabled={running}>
            {running ? "⏳ 실행 중..." : "🔄 전체 Heartbeat"}
          </button>
        </div>
      </div>

      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>에이전트별 수동 실행</div>
        {activeAgents.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>활성 에이전트가 없습니다</div>
          : activeAgents.map(function(agent) {
            var mi = MODELS[agent.adapterConfig ? agent.adapterConfig.model : ""] || { name: "?" };
            var isRunning = running === agent.id;
            var budgetPct = agent.budgetMonthlyCents > 0 ? Math.round(agent.spentMonthlyCents / agent.budgetMonthlyCents * 100) : 0;
            var overBudget = agent.budgetMonthlyCents > 0 && agent.spentMonthlyCents >= agent.budgetMonthlyCents;
            return (
              <div key={agent.id} className="table-row">
                <span style={{fontSize:20}}>{agent.icon || "🤖"}</span>
                <div style={{flex:1}}>
                  <div className="font-medium">{agent.name}</div>
                  <div className="text-sm text-muted">{mi.name} · {agent.title || agent.role}</div>
                </div>
                <span className={"badge badge-" + agent.status}>{isRunning ? "실행 중..." : agent.status}</span>
                <span className="text-sm text-muted">{"$" + (agent.spentMonthlyCents / 100).toFixed(2) + " / $" + (agent.budgetMonthlyCents / 100).toFixed(0)}</span>
                {overBudget
                  ? <span className="badge badge-error">예산 초과</span>
                  : <button className="btn" style={{padding:"4px 12px",fontSize:12}} onClick={function(){runAgent(agent)}} disabled={isRunning || agent.status === "working"}>
                      {isRunning ? "⏳" : "▶️ 실행"}
                    </button>
                }
              </div>
            );
          })
        }
      </div>

      {lastResult && (
        <div className="card">
          <div className="font-medium" style={{marginBottom:8}}>마지막 실행 결과</div>
          {lastResult.success
            ? <div>
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <span className="badge badge-done">성공</span>
                  <span className="cost-pill">{"$" + (lastResult.costCents / 100).toFixed(3)}</span>
                  {lastResult.run && <span className="token-pill">{(lastResult.run.inputTokens||0) + "+" + (lastResult.run.outputTokens||0) + " tokens"}</span>}
                </div>
                {lastResult.run && lastResult.run.responseExcerpt && (
                  <div className="run-log">{lastResult.run.responseExcerpt}</div>
                )}
              </div>
            : <div>
                <span className="badge badge-error">실패</span>
                <div className="text-sm" style={{marginTop:8,color:"var(--danger)"}}>{lastResult.error}</div>
              </div>
          }
        </div>
      )}

      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>실행 기록 (최근 20건)</div>
        {recentRuns.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>아직 실행 기록이 없습니다</div>
          : recentRuns.map(function(run) {
            var agent = data.agents.find(function(a) { return a.id === run.agentId; });
            return (
              <div key={run.id} className="run-card">
                <div className="run-card-header">
                  <span>{agent ? agent.icon : "🤖"}</span>
                  <span className="text-sm font-medium">{agent ? agent.name : "?"}</span>
                  <span className={"badge badge-" + (run.status === "completed" ? "done" : "error")}>{run.status}</span>
                  {run.costCents > 0 && <span className="cost-pill">{"$" + (run.costCents / 100).toFixed(3)}</span>}
                  {run.inputTokens > 0 && <span className="token-pill">{run.inputTokens + "+" + (run.outputTokens || 0)}</span>}
                  <span className="text-sm text-muted" style={{marginLeft:"auto"}}>{new Date(run.startedAt).toLocaleString("ko-KR")}</span>
                </div>
                {run.summary && <div className="text-sm">{run.summary}</div>}
                {run.error && <div className="text-sm" style={{color:"var(--danger)"}}>{run.error}</div>}
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

function CostsPage({ data }) {
  const co = data.companies[0];
  const n = new Date();
  const monthEvents = data.costEvents.filter(function(e) {
    var d = new Date(e.occurredAt);
    return d.getUTCFullYear() === n.getUTCFullYear() && d.getUTCMonth() === n.getUTCMonth();
  });
  const totalCostCents = monthEvents.reduce(function(s, e) { return s + (e.costCents || 0); }, 0);
  const totalCalls = monthEvents.length;
  const totalInputTokens = monthEvents.reduce(function(s, e) { return s + (e.inputTokens || 0); }, 0);
  const totalOutputTokens = monthEvents.reduce(function(s, e) { return s + (e.outputTokens || 0); }, 0);
  const avgCost = totalCalls > 0 ? totalCostCents / totalCalls : 0;
  const budgetCents = co ? co.budgetMonthlyCents : 0;
  const budgetPct = budgetCents > 0 ? Math.min(100, Math.round(totalCostCents / budgetCents * 100)) : 0;

  // Agent cost breakdown
  const agentCosts = data.agents.map(function(agent) {
    var agentEvents = monthEvents.filter(function(e) { return e.agentId === agent.id; });
    var cost = agentEvents.reduce(function(s, e) { return s + (e.costCents || 0); }, 0);
    var calls = agentEvents.length;
    var tokens = agentEvents.reduce(function(s, e) { return s + (e.inputTokens || 0) + (e.outputTokens || 0); }, 0);
    var pct = agent.budgetMonthlyCents > 0 ? Math.min(100, Math.round(agent.spentMonthlyCents / agent.budgetMonthlyCents * 100)) : 0;
    var over = agent.budgetMonthlyCents > 0 && agent.spentMonthlyCents >= agent.budgetMonthlyCents;
    return { agent: agent, cost: cost, calls: calls, tokens: tokens, pct: pct, over: over };
  });

  // Model breakdown
  var modelMap = {};
  monthEvents.forEach(function(e) {
    if (!modelMap[e.model]) modelMap[e.model] = { calls: 0, cost: 0, inputTokens: 0, outputTokens: 0 };
    modelMap[e.model].calls++;
    modelMap[e.model].cost += (e.costCents || 0);
    modelMap[e.model].inputTokens += (e.inputTokens || 0);
    modelMap[e.model].outputTokens += (e.outputTokens || 0);
  });
  var modelColors = { "claude-opus-4-6": "#8b5cf6", "claude-sonnet-4-5": "#6366f1", "claude-haiku-4-5-20251001": "#06b6d4" };
  var modelEntries = Object.keys(modelMap).map(function(k) {
    return { model: k, name: (MODELS[k] || {}).name || k, color: modelColors[k] || "#94a3b8", ...modelMap[k] };
  }).sort(function(a, b) { return b.cost - a.cost; });

  // Daily chart (last 14 days)
  var dailyData = [];
  for (var i = 13; i >= 0; i--) {
    var day = new Date(n);
    day.setDate(day.getDate() - i);
    var dayStr = day.toISOString().slice(0, 10);
    var dayCost = data.costEvents.filter(function(e) {
      return e.occurredAt && e.occurredAt.slice(0, 10) === dayStr;
    }).reduce(function(s, e) { return s + (e.costCents || 0); }, 0);
    dailyData.push({ label: (day.getMonth() + 1) + "/" + day.getDate(), cost: dayCost });
  }
  var maxDailyCost = Math.max.apply(null, dailyData.map(function(d) { return d.cost; })) || 1;

  // Recent events
  var recentEvents = data.costEvents.slice(-30).reverse();

  return (
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      {/* Summary Cards */}
      <div className="card-grid">
        <div className="card metric-card">
          <div className="metric-label">이번 달 비용</div>
          <div className="metric-value">{"$" + (totalCostCents / 100).toFixed(2)}</div>
          <div className="metric-sub">{"예산 $" + (budgetCents / 100).toFixed(0) + " (" + budgetPct + "%)"}</div>
          <div className="progress-bar" style={{marginTop:8}}>
            <div className="progress-fill" style={{width:budgetPct+"%",background:budgetPct>=90?"var(--danger)":budgetPct>=70?"var(--warning)":"var(--success)"}}/>
          </div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">API 호출 수</div>
          <div className="metric-value">{totalCalls}</div>
          <div className="metric-sub">이번 달</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">총 토큰</div>
          <div className="metric-value">{((totalInputTokens + totalOutputTokens) / 1000).toFixed(1) + "K"}</div>
          <div className="metric-sub">{"입력 " + (totalInputTokens/1000).toFixed(1) + "K · 출력 " + (totalOutputTokens/1000).toFixed(1) + "K"}</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">평균 호출 비용</div>
          <div className="metric-value">{"$" + (avgCost / 100).toFixed(3)}</div>
          <div className="metric-sub">호출당</div>
        </div>
      </div>

      <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
        {/* Agent Cost Table */}
        <div className="card" style={{flex:"1 1 400px"}}>
          <div className="font-medium" style={{marginBottom:12}}>에이전트별 비용</div>
          {agentCosts.length === 0
            ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>에이전트가 없습니다</div>
            : agentCosts.map(function(ac) {
              var mi = MODELS[ac.agent.adapterConfig ? ac.agent.adapterConfig.model : ""] || { name: "?" };
              return (
                <div key={ac.agent.id} className="table-row" style={{flexWrap:"wrap"}}>
                  <span style={{fontSize:20}}>{ac.agent.icon || "🤖"}</span>
                  <div style={{flex:"1 1 120px",minWidth:0}}>
                    <div className="text-sm font-medium">{ac.agent.name}</div>
                    <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{mi.name} · {ac.calls}회</div>
                  </div>
                  <div style={{flex:"1 1 160px",minWidth:120}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span className="text-sm font-medium">{"$" + (ac.agent.spentMonthlyCents / 100).toFixed(2)}</span>
                      <span className="text-sm text-muted">{"/ $" + (ac.agent.budgetMonthlyCents / 100).toFixed(0)}</span>
                    </div>
                    <div className="progress-bar">
                      <div className="progress-fill" style={{width:ac.pct+"%",background:ac.over?"var(--danger)":ac.pct>=70?"var(--warning)":"var(--accent)"}}/>
                    </div>
                  </div>
                  {ac.over && <span className="badge badge-error" style={{fontSize:11}}>초과</span>}
                </div>
              );
            })
          }
        </div>

        {/* Model Breakdown */}
        <div className="card" style={{flex:"1 1 300px"}}>
          <div className="font-medium" style={{marginBottom:12}}>모델별 비용</div>
          {totalCostCents > 0 && (
            <div className="model-bar" style={{marginBottom:16}}>
              {modelEntries.map(function(m) {
                var widthPct = Math.max(2, Math.round(m.cost / totalCostCents * 100));
                return <div key={m.model} className="model-segment" title={m.name + ": $" + (m.cost / 100).toFixed(2)} style={{width:widthPct+"%",background:m.color}}/>;
              })}
            </div>
          )}
          {modelEntries.length === 0
            ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>데이터가 없습니다</div>
            : modelEntries.map(function(m) {
              return (
                <div key={m.model} className="table-row">
                  <span style={{width:10,height:10,borderRadius:"50%",background:m.color,flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div className="text-sm font-medium">{m.name}</div>
                    <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{m.calls + "회 · " + ((m.inputTokens + m.outputTokens) / 1000).toFixed(1) + "K tokens"}</div>
                  </div>
                  <span className="text-sm font-medium">{"$" + (m.cost / 100).toFixed(2)}</span>
                  <span className="text-sm text-muted">{totalCostCents > 0 ? Math.round(m.cost / totalCostCents * 100) + "%" : "0%"}</span>
                </div>
              );
            })
          }
        </div>
      </div>

      {/* Daily Cost Chart */}
      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>일별 비용 추이 (최근 14일)</div>
        <div className="daily-chart">
          {dailyData.map(function(d, idx) {
            var heightPct = d.cost > 0 ? Math.max(4, (d.cost / maxDailyCost) * 100) : 0;
            return (
              <div key={idx} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
                {d.cost > 0 && <div className="text-sm" style={{fontSize:10,color:"var(--text-tertiary)",marginBottom:4}}>{"$" + (d.cost / 100).toFixed(2)}</div>}
                <div className="daily-bar" style={{width:"100%",height:heightPct+"%"}} title={d.label + ": $" + (d.cost / 100).toFixed(2)}/>
                <div className="daily-label">{d.label}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Recent Cost Events */}
      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>{"최근 비용 이벤트 (" + Math.min(30, data.costEvents.length) + "건)"}</div>
        {recentEvents.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>아직 비용 이벤트가 없습니다. Heartbeat를 실행해보세요!</div>
          : recentEvents.map(function(ev) {
            var agent = data.agents.find(function(a) { return a.id === ev.agentId; });
            var mi = MODELS[ev.model] || { name: ev.model };
            return (
              <div key={ev.id} className="table-row">
                <span style={{fontSize:16}}>{agent ? agent.icon : "🤖"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div className="text-sm font-medium">{agent ? agent.name : "알 수 없음"}</div>
                  <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{mi.name}</div>
                </div>
                <span className="token-pill">{(ev.inputTokens || 0) + "+" + (ev.outputTokens || 0)}</span>
                <span className="cost-pill">{"$" + ((ev.costCents || 0) / 100).toFixed(3)}</span>
                <span className="text-sm text-muted" style={{whiteSpace:"nowrap"}}>{new Date(ev.occurredAt).toLocaleString("ko-KR")}</span>
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

function PasswordManager() {
  var hasLock = !!localStorage.getItem(LOCK_KEY);
  const [curPw, setCurPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [newPw2, setNewPw2] = useState("");
  const [msg, setMsg] = useState("");
  const [msgType, setMsgType] = useState("");

  const changePw = async () => {
    if (hasLock) {
      var curHash = await hashPassword(curPw);
      if (curHash !== localStorage.getItem(LOCK_KEY)) { setMsg("현재 비밀번호가 틀렸습니다."); setMsgType("error"); return; }
    }
    if (newPw.length < 4) { setMsg("새 비밀번호는 4자 이상이어야 합니다."); setMsgType("error"); return; }
    if (newPw !== newPw2) { setMsg("새 비밀번호가 일치하지 않습니다."); setMsgType("error"); return; }
    var hash = await hashPassword(newPw);
    localStorage.setItem(LOCK_KEY, hash);
    setCurPw(""); setNewPw(""); setNewPw2("");
    setMsg("비밀번호가 변경되었습니다!"); setMsgType("success");
  };

  const removePw = async () => {
    if (!hasLock) return;
    var curHash = await hashPassword(curPw);
    if (curHash !== localStorage.getItem(LOCK_KEY)) { setMsg("현재 비밀번호가 틀렸습니다."); setMsgType("error"); return; }
    if (!confirm("비밀번호 잠금을 해제하시겠습니까?")) return;
    localStorage.removeItem(LOCK_KEY);
    setCurPw("");
    setMsg("비밀번호가 제거되었습니다."); setMsgType("success");
  };

  return (
    <div>
      <div className="text-sm text-muted" style={{marginBottom:12}}>{hasLock ? "🔒 비밀번호가 설정되어 있습니다." : "🔓 비밀번호가 설정되지 않았습니다."}</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {hasLock && <input className="input" type="password" placeholder="현재 비밀번호" value={curPw} onChange={function(e){setCurPw(e.target.value);setMsg("")}}/>}
        <input className="input" type="password" placeholder="새 비밀번호 (4자 이상)" value={newPw} onChange={function(e){setNewPw(e.target.value);setMsg("")}}/>
        <input className="input" type="password" placeholder="새 비밀번호 확인" value={newPw2} onChange={function(e){setNewPw2(e.target.value);setMsg("")}}/>
        {msg && <div className="text-sm" style={{color:msgType==="error"?"var(--danger)":"var(--success)"}}>{msg}</div>}
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary" onClick={changePw}>{hasLock ? "비밀번호 변경" : "비밀번호 설정"}</button>
          {hasLock && <button className="btn" onClick={removePw} style={{color:"var(--danger)"}}>비밀번호 제거</button>}
        </div>
      </div>
    </div>
  );
}

function ProjectsPage({ data, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { name: "", description: "", status: "active" };
  const [f, setF] = useState({ ...blank });

  const create = () => {
    if (!f.name.trim()) return;
    var co = data.companies[0];
    var project = { id: uid(), companyId: co ? co.id : "", name: f.name, description: f.description, status: f.status, createdAt: now(), updatedAt: now() };
    onUpdate({ ...data, projects: [...data.projects, project], activityLog: [...data.activityLog, { id: uid(), emoji: "📁", message: "프로젝트 \"" + f.name + "\" 생성됨", createdAt: now() }] });
    setF({ ...blank }); setShowForm(false);
  };

  const del = (id) => {
    var p = data.projects.find(function(x) { return x.id === id; });
    var updatedIssues = data.issues.map(function(i) { return i.projectId === id ? { ...i, projectId: null } : i; });
    onUpdate({ ...data, projects: data.projects.filter(function(x) { return x.id !== id; }), issues: updatedIssues, activityLog: [...data.activityLog, { id: uid(), emoji: "🗑️", message: "프로젝트 \"" + (p ? p.name : "") + "\" 삭제됨", createdAt: now() }] });
  };

  const toggleStatus = (id) => {
    onUpdate({ ...data, projects: data.projects.map(function(p) { return p.id === id ? { ...p, status: p.status === "active" ? "archived" : "active", updatedAt: now() } : p; }) });
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>📁 프로젝트 ({data.projects.length})</div>

      </div>

      {showForm && (
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="프로젝트 이름 *" value={f.name} onChange={function(e){setF({...f,name:e.target.value})}}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={function(e){setF({...f,description:e.target.value})}} rows={2} style={{resize:"vertical"}}/>
          <button className="btn btn-primary" onClick={create}>프로젝트 생성</button>
        </div>
      )}

      {data.projects.length === 0
        ? <div className="card" style={{textAlign:"center",padding:40}}><div className="text-sm text-muted">첫 번째 프로젝트를 만들어보세요!</div></div>
        : data.projects.map(function(p) {
          var projectIssues = data.issues.filter(function(i) { return i.projectId === p.id; });
          var doneCount = projectIssues.filter(function(i) { return i.status === "done"; }).length;
          var progressPct = projectIssues.length > 0 ? Math.round(doneCount / projectIssues.length * 100) : 0;
          return (
            <div key={p.id} className="card">
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
                <span style={{fontSize:24}}>📁</span>
                <div style={{flex:1}}>
                  <div className="font-medium" style={{fontSize:16}}>{p.name}</div>
                  {p.description && <div className="text-sm text-muted">{p.description}</div>}
                </div>
                <span className={"badge " + (p.status === "active" ? "badge-working" : "badge-idle")}>{p.status === "active" ? "활성" : "보관됨"}</span>
                <button className="btn" style={{padding:"4px 8px",fontSize:12}} onClick={function(){toggleStatus(p.id)}}>{p.status === "active" ? "보관" : "활성화"}</button>
                <button className="btn" style={{padding:"4px 8px",fontSize:12,color:"var(--danger)"}} onClick={function(){del(p.id)}}>삭제</button>
              </div>
              <div style={{display:"flex",gap:16,alignItems:"center"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span className="text-sm text-muted">{"이슈 " + projectIssues.length + "건"}</span>
                    <span className="text-sm text-muted">{doneCount + "/" + projectIssues.length + " 완료 (" + progressPct + "%)"}</span>
                  </div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width:progressPct+"%",background:"var(--success)"}}/>
                  </div>
                </div>
              </div>
              {projectIssues.length > 0 && (
                <div style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
                  {projectIssues.slice(0, 5).map(function(i) {
                    return <span key={i.id} className={"badge badge-" + (i.status === "done" ? "done" : i.status === "in_progress" ? "working" : "idle")} style={{fontSize:11}}>{i.identifier + " " + i.title.substring(0, 20)}</span>;
                  })}
                  {projectIssues.length > 5 && <span className="text-sm text-muted">{"+" + (projectIssues.length - 5) + "건"}</span>}
                </div>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

// ========== Goals Page ==========
function GoalsPage({ data, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { title: "", description: "", level: "company", assigneeAgentId: "", targetDate: "", status: "active" };
  const [f, setF] = useState({ ...blank });

  const create = () => {
    if (!f.title.trim()) return;
    var co = data.companies[0];
    var goal = { id: uid(), companyId: co ? co.id : "", title: f.title, description: f.description, level: f.level, assigneeAgentId: f.assigneeAgentId || null, targetDate: f.targetDate || null, status: f.status, progress: 0, createdAt: now(), updatedAt: now() };
    onUpdate({ ...data, goals: [...data.goals, goal], activityLog: [...data.activityLog, { id: uid(), emoji: "🎯", message: "목표 \"" + f.title + "\" 생성됨 (" + f.level + ")", createdAt: now() }] });
    setF({ ...blank }); setShowForm(false);
  };

  const del = (id) => {
    var g = data.goals.find(function(x) { return x.id === id; });
    onUpdate({ ...data, goals: data.goals.filter(function(x) { return x.id !== id; }), activityLog: [...data.activityLog, { id: uid(), emoji: "🗑️", message: "목표 \"" + (g ? g.title : "") + "\" 삭제됨", createdAt: now() }] });
  };

  const updateProgress = (id, progress) => {
    var newStatus = progress >= 100 ? "completed" : "active";
    onUpdate({ ...data, goals: data.goals.map(function(g) { return g.id === id ? { ...g, progress: Math.min(100, Math.max(0, parseInt(progress) || 0)), status: newStatus, updatedAt: now() } : g; }) });
  };

  var levelLabels = { company: "🏢 회사", team: "👥 팀", agent: "🤖 에이전트" };
  var companyGoals = data.goals.filter(function(g) { return g.level === "company"; });
  var teamGoals = data.goals.filter(function(g) { return g.level === "team"; });
  var agentGoals = data.goals.filter(function(g) { return g.level === "agent"; });

  var renderGoal = function(g) {
    var agent = g.assigneeAgentId ? data.agents.find(function(a) { return a.id === g.assigneeAgentId; }) : null;
    var isCompleted = g.status === "completed" || g.progress >= 100;
    return (
      <div key={g.id} className="card" style={{padding:16,marginBottom:8,opacity:isCompleted?0.7:1}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <span>{isCompleted ? "✅" : "🎯"}</span>
          <div style={{flex:1}}>
            <div className="font-medium">{g.title}</div>
            {g.description && <div className="text-sm text-muted">{g.description}</div>}
          </div>
          {agent && <span className="badge badge-idle" style={{fontSize:11}}>{agent.icon + " " + agent.name}</span>}
          {g.targetDate && <span className="text-sm text-muted">{g.targetDate}</span>}
          <button className="btn" style={{padding:"4px 8px",fontSize:12,color:"var(--danger)"}} onClick={function(){del(g.id)}}>삭제</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div className="progress-bar" style={{flex:1}}>
            <div className="progress-fill" style={{width:(g.progress||0)+"%",background:isCompleted?"var(--success)":(g.progress||0)>=50?"var(--accent)":"var(--info)"}}/>
          </div>
          <input type="number" min="0" max="100" value={g.progress||0} onChange={function(e){updateProgress(g.id,e.target.value)}} style={{width:52,padding:"2px 6px",border:"1px solid var(--border)",borderRadius:4,fontSize:12,textAlign:"center",background:"var(--bg-primary)",color:"var(--text-primary)"}}/>
          <span className="text-sm text-muted">%</span>
        </div>
      </div>
    );
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>🎯 목표 계층 ({data.goals.length})</div>
        <button className="btn btn-primary" onClick={function(){setShowForm(!showForm)}}>{showForm ? "취소" : "+ 목표 추가"}</button>
      </div>

      {showForm && (
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="목표 제목 *" value={f.title} onChange={function(e){setF({...f,title:e.target.value})}}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={function(e){setF({...f,description:e.target.value})}} rows={2} style={{resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}>
            <select className="input" value={f.level} onChange={function(e){setF({...f,level:e.target.value})}} style={{flex:1}}>
              <option value="company">🏢 회사 목표</option>
              <option value="team">👥 팀 목표</option>
              <option value="agent">🤖 에이전트 목표</option>
            </select>
            <select className="input" value={f.assigneeAgentId} onChange={function(e){setF({...f,assigneeAgentId:e.target.value})}} style={{flex:1}}>
              <option value="">담당자 없음</option>
              {data.agents.map(function(a){return <option key={a.id} value={a.id}>{a.icon + " " + a.name}</option>})}
            </select>
            <input className="input" type="date" value={f.targetDate} onChange={function(e){setF({...f,targetDate:e.target.value})}} style={{flex:1}}/>
          </div>
          <button className="btn btn-primary" onClick={create}>목표 추가</button>
        </div>
      )}

      {data.goals.length === 0
        ? <div className="card" style={{textAlign:"center",padding:40}}><div className="text-sm text-muted">회사 → 팀 → 에이전트 순으로 목표를 설정해보세요!</div></div>
        : (
          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            {companyGoals.length > 0 && (
              <div>
                <div className="text-sm font-medium" style={{marginBottom:8,color:"var(--text-secondary)"}}>🏢 회사 목표 ({companyGoals.length})</div>
                {companyGoals.map(renderGoal)}
              </div>
            )}
            {teamGoals.length > 0 && (
              <div>
                <div className="text-sm font-medium" style={{marginBottom:8,color:"var(--text-secondary)"}}>👥 팀 목표 ({teamGoals.length})</div>
                {teamGoals.map(renderGoal)}
              </div>
            )}
            {agentGoals.length > 0 && (
              <div>
                <div className="text-sm font-medium" style={{marginBottom:8,color:"var(--text-secondary)"}}>🤖 에이전트 목표 ({agentGoals.length})</div>
                {agentGoals.map(renderGoal)}
              </div>
            )}
          </div>
        )
      }
    </div>
  );
}

// ========== Approvals Page ==========
function ApprovalsPage({ data, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { title: "", description: "", type: "action", requesterId: "" };
  const [f, setF] = useState({ ...blank });

  const create = () => {
    if (!f.title.trim()) return;
    var approval = { id: uid(), title: f.title, description: f.description, type: f.type, requesterId: f.requesterId || null, status: "pending", createdAt: now(), updatedAt: now(), resolvedAt: null, resolvedBy: "human" };
    onUpdate({ ...data, approvals: [...data.approvals, approval], activityLog: [...data.activityLog, { id: uid(), emoji: "🛡️", message: "승인 요청: \"" + f.title + "\"", createdAt: now() }] });
    setF({ ...blank }); setShowForm(false);
  };

  const resolve = (id, status) => {
    var ap = data.approvals.find(function(a) { return a.id === id; });
    onUpdate({ ...data,
      approvals: data.approvals.map(function(a) { return a.id === id ? { ...a, status: status, resolvedAt: now(), updatedAt: now() } : a; }),
      activityLog: [...data.activityLog, { id: uid(), emoji: status === "approved" ? "✅" : "❌", message: "\"" + (ap ? ap.title : "") + "\" " + (status === "approved" ? "승인됨" : "거부됨"), createdAt: now() }],
    });
  };

  const del = (id) => {
    onUpdate({ ...data, approvals: data.approvals.filter(function(a) { return a.id !== id; }) });
  };

  var pending = data.approvals.filter(function(a) { return a.status === "pending"; });
  var resolved = data.approvals.filter(function(a) { return a.status !== "pending"; }).slice(-20).reverse();

  var typeLabels = { action: "⚡ 액션", budget: "💰 예산", hire: "👤 채용", deploy: "🚀 배포", other: "📋 기타" };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div className="font-bold" style={{fontSize:18}}>{"🛡️ 승인 대기열 (" + pending.length + "건 대기)"}</div>
        <button className="btn btn-primary" onClick={function(){setShowForm(!showForm)}}>{showForm ? "취소" : "+ 승인 요청"}</button>
      </div>

      {showForm && (
        <div className="card" style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="input" placeholder="승인 요청 제목 *" value={f.title} onChange={function(e){setF({...f,title:e.target.value})}}/>
          <textarea className="input" placeholder="설명 (선택)" value={f.description} onChange={function(e){setF({...f,description:e.target.value})}} rows={2} style={{resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}>
            <select className="input" value={f.type} onChange={function(e){setF({...f,type:e.target.value})}} style={{flex:1}}>
              <option value="action">⚡ 액션</option>
              <option value="budget">💰 예산</option>
              <option value="hire">👤 채용</option>
              <option value="deploy">🚀 배포</option>
              <option value="other">📋 기타</option>
            </select>
            <select className="input" value={f.requesterId} onChange={function(e){setF({...f,requesterId:e.target.value})}} style={{flex:1}}>
              <option value="">요청자 (선택)</option>
              {data.agents.map(function(a){return <option key={a.id} value={a.id}>{a.icon + " " + a.name}</option>})}
            </select>
          </div>
          <button className="btn btn-primary" onClick={create}>승인 요청 생성</button>
        </div>
      )}

      {/* Pending */}
      <div className="card">
        <div className="font-medium" style={{marginBottom:12}}>{"⏳ 대기 중 (" + pending.length + ")"}</div>
        {pending.length === 0
          ? <div className="text-sm text-muted" style={{padding:20,textAlign:"center"}}>대기 중인 승인 요청이 없습니다</div>
          : pending.map(function(ap) {
            var requester = ap.requesterId ? data.agents.find(function(a) { return a.id === ap.requesterId; }) : null;
            return (
              <div key={ap.id} className="table-row" style={{flexWrap:"wrap",gap:8}}>
                <span className="badge badge-paused" style={{fontSize:11}}>{typeLabels[ap.type] || ap.type}</span>
                <div style={{flex:"1 1 200px",minWidth:0}}>
                  <div className="text-sm font-medium">{ap.title}</div>
                  {ap.description && <div style={{fontSize:11,color:"var(--text-tertiary)"}}>{ap.description}</div>}
                </div>
                {requester && <span className="text-sm text-muted">{requester.icon + " " + requester.name}</span>}
                <span className="text-sm text-muted">{new Date(ap.createdAt).toLocaleString("ko-KR")}</span>
                <div style={{display:"flex",gap:4}}>
                  <button className="btn" style={{padding:"4px 12px",fontSize:12,background:"var(--success-light)",color:"var(--success)",borderColor:"var(--success)"}} onClick={function(){resolve(ap.id,"approved")}}>✅ 승인</button>
                  <button className="btn" style={{padding:"4px 12px",fontSize:12,background:"var(--danger-light)",color:"var(--danger)",borderColor:"var(--danger)"}} onClick={function(){resolve(ap.id,"rejected")}}>❌ 거부</button>
                </div>
              </div>
            );
          })
        }
      </div>

      {/* Resolved */}
      {resolved.length > 0 && (
        <div className="card">
          <div className="font-medium" style={{marginBottom:12}}>{"📋 처리 완료 (최근 " + resolved.length + "건)"}</div>
          {resolved.map(function(ap) {
            var requester = ap.requesterId ? data.agents.find(function(a) { return a.id === ap.requesterId; }) : null;
            return (
              <div key={ap.id} className="table-row" style={{opacity:0.7}}>
                <span className={"badge " + (ap.status === "approved" ? "badge-done" : "badge-error")} style={{fontSize:11}}>{ap.status === "approved" ? "승인됨" : "거부됨"}</span>
                <span className="badge badge-idle" style={{fontSize:11}}>{typeLabels[ap.type] || ap.type}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div className="text-sm">{ap.title}</div>
                </div>
                {requester && <span className="text-sm text-muted">{requester.icon}</span>}
                <span className="text-sm text-muted">{ap.resolvedAt ? new Date(ap.resolvedAt).toLocaleString("ko-KR") : ""}</span>
                <button className="btn" style={{padding:"2px 6px",fontSize:11}} onClick={function(){del(ap.id)}}>삭제</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [data, setData] = useState(()=>load()||init());
  const [page, setPage] = useState("dashboard");
  const [authed, setAuthed] = useState(()=>sessionStorage.getItem(AUTH_KEY)==="1");

  useEffect(()=>{save(data);},[data]);

  if(localStorage.getItem(LOCK_KEY) && !authed) return <LockScreen onUnlock={()=>setAuthed(true)}/>;
  if(!localStorage.getItem(LOCK_KEY) && !authed) return <LockScreen onUnlock={()=>setAuthed(true)}/>;

  if(!data.settings.apiKey) return <SetupScreen data={data} onUpdate={setData}/>;

  const co = data.companies[0];
  const pages = {
    dashboard: <DashboardPage data={data} onUpdate={setData}/>,
    agents: <AgentsPage data={data} onUpdate={setData}/>,
    issues: <IssuesPage data={data} onUpdate={setData}/>,
    projects: <ProjectsPage data={data} onUpdate={setData}/>,
    goals: <GoalsPage data={data} onUpdate={setData}/>,
    approvals: <ApprovalsPage data={data} onUpdate={setData}/>,
    costs: <CostsPage data={data}/>,
    routines: <HeartbeatPage data={data} onUpdate={setData}/>,
    activity: <ActivityPage data={data}/>,
    settings: <SettingsPage data={data} onUpdate={setData}/>,
  };

  return (
    <div className="app">
      <SidebarNav data={data} activePage={page} onNav={setPage}/>
      <div className="main">
        <div className="header">
          <div className="font-medium">{co?co.name:"JWAY Digital"}</div>
          <div style={{flex:1}}/>
          <div className="text-sm text-muted">Board: JaeWoo</div>
        </div>
        <div className="content">{pages[page]||pages.dashboard}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
